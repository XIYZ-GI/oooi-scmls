server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64m;

    # 定期通过 Docker DNS 更新容器地址，避免容器重启后仍连接旧 IP。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $simulation_backend backend:8000;
    set $generation_backend generation:8001;

    location /api/generation/ {
        proxy_pass http://$generation_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://$simulation_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }

    location /ws/ {
        proxy_pass http://$simulation_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
